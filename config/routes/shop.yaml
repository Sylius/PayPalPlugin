sylius_paypal_shop_create_paypal_order_for_payment_request:
    path: /paypal/payment-requests/{hash}/order
    methods: [POST]
    defaults:
        _controller: sylius_paypal.controller.create_paypal_order_for_payment_request
    requirements:
        hash: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'

sylius_paypal_shop_create_paypal_order_from_cart:
    path: /create-pay-pal-order-from-cart/{id}
    methods: [POST, GET]
    defaults:
        _controller: sylius_paypal.controller.create_paypal_order_from_cart

sylius_paypal_shop_complete_express_checkout:
    path: /paypal/express-checkout/complete
    methods: [POST]
    defaults:
        _controller: sylius_paypal.controller.complete_express_checkout

sylius_paypal_shop_cancel_order:
    path: /cancel-pay-pal-order
    methods: [POST]
    defaults:
        _controller: sylius_paypal.controller.cancel_paypal_order

sylius_paypal_shop_payment_error:
    path: /pay-pal-payment-error
    methods: [POST]
    defaults:
        _controller: sylius_paypal.controller.paypal_payment_on_error

sylius_paypal_shop_add_to_cart:
    path: /paypal-add-to-cart/{productId}
    methods: [POST]
    defaults:
        _controller: sylius_paypal.controller.add_to_cart
        _sylius:
            factory:
                method: createForProduct
                arguments: [ expr:notFoundOnNull(service('sylius.repository.product').find($productId)) ]
            form:
                type: Sylius\Bundle\ShopBundle\Form\Type\AddToCartType
                options:
                    product: expr:notFoundOnNull(service('sylius.repository.product').find($productId))

sylius_paypal_shop_pay_with_paypal_form:
    path: /pay-with-paypal/{orderToken}/{paymentId}
    methods: [GET]
    defaults:
        _controller: sylius_paypal.controller.pre_upgrade_checkout::payWithPayPalFormAction

sylius_paypal_shop_complete_paypal_order:
    path: /complete-pay-pal-order/{token}
    methods: [POST]
    defaults:
        _controller: sylius_paypal.controller.pre_upgrade_checkout::completePayPalOrderAction

sylius_paypal_shop_cancel_checkout_payment:
    path: /cancel-pay-pal-checkout-payment
    methods: [POST]
    defaults:
        _controller: sylius_paypal.controller.pre_upgrade_checkout::cancelCheckoutPaymentAction

sylius_paypal_shop_redirect_return:
    path: /paypal/redirect-return/{token}/{nonce}
    methods: [GET]
    defaults:
        _controller: sylius_paypal.controller.pre_upgrade_checkout::payerActionReturnAction
    requirements:
        nonce: '[A-Za-z0-9_-]{16,128}'

sylius_paypal_shop_redirect_cancel:
    path: /paypal/redirect-cancel/{token}/{nonce}
    methods: [GET]
    defaults:
        _controller: sylius_paypal.controller.pre_upgrade_checkout::payerActionCancelAction
    requirements:
        nonce: '[A-Za-z0-9_-]{16,128}'
