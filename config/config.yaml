imports:
    - { resource: "@SyliusPayPalPlugin/config/integrations/winzou_state_machine/config.php" }
    - { resource: '@SyliusPayPalPlugin/config/app/twig_hooks/**/*.yaml' }

framework:
    messenger:
        buses:
            sylius_paypal.package_tracking_bus: ~

sylius_admin:
    twig:
        payment_method:
            excluded_gateways:
                - !php/const Sylius\PayPalPlugin\DependencyInjection\SyliusPayPalExtension::PAYPAL_FACTORY_NAME

sylius_grid:
    templates:
        action:
            complete_payment: "@SyliusPayPalPlugin/admin/payment/grid/action/complete_payment.html.twig"
            enable_paypal: "@SyliusPayPalPlugin/admin/payment_method/grid/action/enable_paypal.html.twig"
            enable_seller: "@SyliusPayPalPlugin/admin/payment_method/grid/action/enable_seller.html.twig"
            ship_with_tracking_code: "@SyliusPayPalPlugin/admin/shipment/grid/action/ship_with_tracking_code.html.twig"
    grids:
        sylius_admin_payment:
            actions:
                item:
                    complete:
                        type: complete_payment
        sylius_admin_payment_method:
            fields:
                name:
                    type: twig
                    path: .
                    options:
                        template: "@SyliusPayPalPlugin/admin/payment_method/grid/field/name.html.twig"
                        vars:
                            legacy_layout: '%sylius_paypal.admin.legacy_payment_method_list%'
            actions:
                item:
                    enable_seller:
                        type: enable_seller
                main:
                    enable_paypal:
                        type: enable_paypal

monolog:
    channels: ['paypal']
    handlers:
        paypal:
            level: debug
            type: stream
            path: '%kernel.logs_dir%/paypal.log'
            channels: [paypal]
