imports:
    - { resource: "@SyliusPayPalPlugin/config/integrations/winzou_state_machine/config.php" }
    - { resource: '@SyliusPayPalPlugin/config/app/twig_hooks/**/*.yaml' }

framework:
    messenger:
        buses:
            # Package tracking is a courtesy to PayPal, sent from inside the ship transition. It must not run
            # under `doctrine_transaction` (Sylius' command bus): a PayPal error rolled back in a nested
            # transaction marks the ship request's own transaction rollback-only and the shipment is never shipped.
            sylius_paypal.package_tracking_bus: ~

sylius_admin:
    twig:
        payment_method:
            excluded_gateways:
                - !php/const Sylius\PayPalPlugin\DependencyInjection\SyliusPayPalExtension::PAYPAL_FACTORY_NAME

sylius_core:
    checkout:
        payment:
            allowed_states:
                - new
                - cart
                - processing

sylius_grid:
    templates:
        action:
            download_report: "@SyliusPayPalPlugin/admin/payment_method/grid/action/download_report.html.twig"
            enable_paypal: "@SyliusPayPalPlugin/admin/payment_method/grid/action/enable_paypal.html.twig"
            enable_seller: "@SyliusPayPalPlugin/admin/payment_method/grid/action/enable_seller.html.twig"
            ship_with_tracking_code: "@SyliusPayPalPlugin/admin/shipment/grid/action/ship_with_tracking_code.html.twig"
    grids:
        sylius_admin_payment_method:
            actions:
                item:
                    enable_seller:
                        type: enable_seller
                    download_report:
                        type: download_report
                        label: sylius_paypal.report
                        icon: tabler:download
                        options:
                            link:
                                route: sylius_paypal_admin_download_payouts_report
                                parameters:
                                    id: resource.id
                main:
                    enable_paypal:
                        type: enable_paypal

monolog:
    channels: ['paypal']
    handlers:
        paypal:
            level: debug
            type: stream
            path: '%kernel.logs_dir%/paypal.log'
            channels: [paypal]
