        items: ["@abandoned_mug_item"]
        currencyCode: "USD"
        localeCode: "en_US"
        customer: "@customer_oliver"
        state: "cart"
        checkoutState: "shipping_selected"
        tokenValue: "TOKEN"
        payments: ["@abandoned_paypal_payment"]

Sylius\Component\Core\Model\OrderItem:
    abandoned_mug_item:
        variant: "@mug_sw"
