Sylius\Component\Core\Model\OrderItemUnit:
    abandoned_mug_item_unit1:
        __construct: ["@abandoned_mug_item"]
    abandoned_mug_item_unit2:
        __construct: ["@abandoned_mug_item"]

Sylius\Component\Core\Model\Payment:
    abandoned_paypal_payment:
        method: "@paypal"
        currencyCode: "USD"
        amount: 40
        state: "processing"
        details:
            status: "CREATED"
            paypal_order_id: "PAYPAL_ORDER_ID"
