        __construct: ["@payment_page_mug_item"]
    payment_page_mug_item_unit2:
        __construct: ["@payment_page_mug_item"]

Sylius\Component\Core\Model\Payment:
    payment_page_paypal_payment:
        method: "@paypal"
        currencyCode: "USD"
        amount: 40
        state: "processing"
